<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shuka — Armenia Marketplace</title>
  <style>
    :root { --primary: #131921; --accent: #febd69; --accent-dark: #f3a847; --bg: #f3f4f6; --card: #ffffff; --border: #e5e7eb; --text: #111827; --muted: #6b7280; --danger: #dc2626; --success: #16a34a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    header { background: var(--primary); color: #fff; padding: 10px 16px; position: sticky; top: 0; z-index: 50; }
    .header-top { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .logo { font-size: 1.4rem; font-weight: 800; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
    .logo span { color: var(--accent); }
    .search-bar { flex: 1; min-width: 200px; display: flex; }
    .search-bar input { flex: 1; padding: 8px 12px; border: none; border-radius: 4px 0 0 4px; font-size: 0.95rem; }
    .search-bar button { background: var(--accent); border: none; padding: 8px 14px; border-radius: 0 4px 4px 0; font-weight: 600; cursor: pointer; }
    .nav-actions { display: flex; align-items: center; gap: 14px; font-size: 0.9rem; flex-wrap: wrap; }
    .nav-actions a, .nav-actions button { color: #fff; text-decoration: none; background: none; border: none; cursor: pointer; font-size: 0.9rem; padding: 4px 6px; }
    .nav-actions a:hover, .nav-actions button:hover { text-decoration: underline; }
    .cat-bar { background: #232f3e; padding: 6px 16px; overflow-x: auto; white-space: nowrap; }
    .cat-bar-inner { max-width: 1200px; margin: 0 auto; display: flex; gap: 16px; }
    .cat-bar a { color: #e5e7eb; text-decoration: none; font-size: 0.85rem; }
    .cat-bar a:hover { color: #fff; }
    main { max-width: 1200px; margin: 20px auto; padding: 0 16px 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; background: #eee; }
    .card h3 { font-size: 1rem; margin: 10px 0 6px; }
    .card h3 a { color: var(--text); text-decoration: none; }
    .price { font-size: 1.1rem; font-weight: 700; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .btn { display: inline-block; padding: 8px 14px; border-radius: 6px; border: 1px solid #d1d5db; background: #fff; color: var(--text); font-weight: 600; cursor: pointer; text-decoration: none; font-size: 0.9rem; text-align: center; }
    .btn-primary { background: var(--accent); border-color: var(--accent-dark); color: #111; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-danger { background: var(--danger); border-color: var(--danger); color: #fff; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .panel { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 18px; margin-bottom: 16px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; }
    .alert { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 0.9rem; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .alert-warn { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
    .alert-ok { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; text-transform: uppercase; background: #e5e7eb; }
    .badge-placed { background: #dbeafe; color: #1e40af; }
    .badge-confirmed { background: #fef3c7; color: #92400e; }
    .badge-shipped { background: #e0e7ff; color: #3730a3; }
    .badge-delivered { background: #dcfce7; color: #166534; }
    .badge-cancelled { background: #fee2e2; color: #991b1b; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 720px) { .two-col { grid-template-columns: 1fr; } }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border); }
  </style>
</head>
<body>
  <header>
    <div class="header-top">
      <a href="/" class="logo" data-link>Shuka<span>.am</span></a>
      <form class="search-bar" id="globalSearchForm">
        <input type="text" id="globalSearchInput" placeholder="Search products on Shuka..." />
        <button type="submit">Search</button>
      </form>
      <div class="nav-actions" id="navActions"></div>
    </div>
  </header>
  <div class="cat-bar">
    <div class="cat-bar-inner" id="catBar"></div>
  </div>
  <main id="app"></main>
  <script src="/app.js"></script>
</body>
</html>
